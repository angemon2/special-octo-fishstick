<!DOCTYPE HTML>
<html>
<head>
	<title> Counting something </title>
  	<style> 
		header {
  position: absolute; 
  top: 0;
  left: 0;
  background-color: #333;
  padding: 20px;
}
ul {
  list-style-type: none;
  overflow: hidden;
  background-color: #333333;
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover {
  background-color: #111111;
}

body {
  font-family: Arial, Sans-serif;
  display: flex; 
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f0f4f8;
}


.container {
  text-align: center;
  padding: 20px; 
  border: 1px solid #ccc;
  border-radius: 10px; 
  background-color: #fff;

}

.counter {
  font-size: 2em;
  margin-bottom: 20px;
}

button {
  padding: 10px 20px;
  font-size: 1em;
  margin: 5px;
  curser: pointer;
}

.clicks{
  font-size: 1.1em;
  margin-top: 10px;
}
</style> 
  
</head>
<body>
	<header>
      <nav>
          <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="Counter.html">Counter</a></li>
              <li><a href="trivia.html">Trivia</a></li>
          </ul>
      </nav>
    </header> 
 <div class="container">
<h1> What are we counting? </h1>
    <div class="counter">
      <p id="count">0</p>
    </div>
    <div>
      <button onclick="dec()">Decrement</button>
      <button onclick="inc()">Increment</button>
    </div>
    <div class="clicks">
      <p>Clicks On Increment: <span id="incCount">0</span> </p>
      <p>Clicks on Decrement: <span id="decCount">0</span></p>
    </div>
	<div class="reset clicks">
      <button onclick="reset()">Reset click count</button>
    </div>
  </div>
<script>
        let c = 0, ci = 0, cd = 0;
        const count = document.getElementById("count");
        const incCount = document.getElementById("incCount");
        const decCount = document.getElementById("decCount");
        function inc() {
            c++;
            ci = ci + 1;
            update();
        }
        function dec() {
            c = c - 1;
            cd = cd + 1;
            update();
        }
        function update() {
            count.textContent = c;
            incCount.textContent = ci;
            decCount.textContent = cd;
        }
	function reset() { 
		cd = cd - cd;
		ci = ci - ci;
		update();
	}
    </script>
</body>
</html>
